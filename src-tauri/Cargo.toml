[package]
name = "pureminecraft"
version = "1.0.0"
description = "PureMinecraft - minimal Minecraft launcher"
authors = ["PureStat Lab"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.6"
md5 = "0.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "PureMinecraft"
path = "src/main.rs"